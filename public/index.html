<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator & Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">
    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-400 mb-2">AI Image Studio</h1>
            <p class="text-gray-400">Nhập ý tưởng của bạn hoặc tải ảnh lên để AI sáng tạo</p>
        </div>

        <!-- Main Card -->
        <div class="bg-gray-800 rounded-xl shadow-lg p-6 mb-8">
            <form id="ai-form" class="space-y-6">
                
                <!-- Upload Ảnh gốc -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Ảnh gốc (Tùy chọn - Để trống nếu muốn tạo ảnh mới)</label>
                    <div class="flex items-center justify-center w-full">
                        <label for="image-upload" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-600 border-dashed rounded-lg cursor-pointer bg-gray-700 hover:bg-gray-600 transition">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <p class="text-sm text-gray-400" id="file-name">Click để chọn ảnh tải lên</p>
                            </div>
                            <input id="image-upload" type="file" accept="image/*" class="hidden" />
                        </label>
                    </div>
                </div>

                <!-- Nhập Prompt -->
                <div>
                    <label for="prompt-input" class="block text-sm font-medium text-gray-300 mb-2">Ý tưởng (Prompt)</label>
                    <textarea id="prompt-input" rows="3" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-3 text-white placeholder-gray-400 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition" placeholder="VD: Một con mèo mặc đồ phi hành gia..." required></textarea>
                </div>

                <!-- Nút Submit -->
                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex justify-center items-center">
                    <span id="btn-text">Bắt đầu tạo ảnh</span>
                    <!-- Loading Spinner (Ẩn mặc định) -->
                    <svg id="loading-spinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </form>
        </div>

        <!-- Result Area -->
        <div id="result-area" class="hidden bg-gray-800 rounded-xl shadow-lg p-6">
            <h2 class="text-xl font-semibold mb-4 text-green-400">✨ Kết quả:</h2>
            <div class="mb-4">
                <p class="text-sm text-gray-400 mb-1">Prompt đã được AI tối ưu:</p>
                <p id="optimized-prompt" class="text-gray-200 italic bg-gray-700 p-3 rounded-lg"></p>
            </div>
            <div class="flex justify-center mb-4">
                <img id="result-image" src="" alt="AI Generated Image" class="max-w-full h-auto rounded-lg shadow-md border-2 border-blue-500">
            </div>
            
            <!-- Download Buttons -->
            <div class="flex gap-3 justify-center mt-6">
                <button id="download-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Tải ảnh xuống
                </button>
                <button id="copy-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-lg transition duration-200 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                    Copy Prompt
                </button>
            </div>
        </div>
        
        <!-- Error Area -->
        <div id="error-area" class="hidden bg-red-900/50 border border-red-500 rounded-xl p-4 text-center mt-4">
            <p id="error-text" class="text-red-200"></p>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="hidden bg-green-900/50 border border-green-500 rounded-xl p-4 text-center mt-4">
            <p id="success-text" class="text-green-200"></p>
        </div>

    </div>

    <script>
        // DOM Elements
        const form = document.getElementById('ai-form');
        const imageUpload = document.getElementById('image-upload');
        const fileNameDisplay = document.getElementById('file-name');
        const promptInput = document.getElementById('prompt-input');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const loadingSpinner = document.getElementById('loading-spinner');
        
        const resultArea = document.getElementById('result-area');
        const optimizedPromptText = document.getElementById('optimized-prompt');
        const resultImage = document.getElementById('result-image');
        const downloadBtn = document.getElementById('download-btn');
        const copyBtn = document.getElementById('copy-btn');
        
        const errorArea = document.getElementById('error-area');
        const errorText = document.getElementById('error-text');
        const successMessage = document.getElementById('success-message');
        const successText = document.getElementById('success-text');

        // State để lưu kết quả
        let currentImageBase64 = '';
        let currentPrompt = '';

        // Hiển thị tên file khi người dùng chọn ảnh
        imageUpload.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileNameDisplay.textContent = `✅ Đã chọn: ${e.target.files[0].name}`;
                fileNameDisplay.classList.add('text-blue-400');
            } else {
                fileNameDisplay.textContent = 'Click để chọn ảnh tải lên';
                fileNameDisplay.classList.remove('text-blue-400');
            }
        });

        // Xử lý Submit Form
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset UI
            resultArea.classList.add('hidden');
            errorArea.classList.add('hidden');
            successMessage.classList.add('hidden');
            
            // Set Loading State
            submitBtn.disabled = true;
            submitBtn.classList.add('cursor-not-allowed', 'opacity-80');
            btnText.textContent = 'Đang xử lý (có thể mất 10-30s)...';
            loadingSpinner.classList.remove('hidden');

            // Thu thập data
            const formData = new FormData();
            formData.append('prompt', promptInput.value);
            
            if (imageUpload.files.length > 0) {
                formData.append('image', imageUpload.files[0]);
            }

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Lưu trữ kết quả
                    currentImageBase64 = data.imageBase64;
                    currentPrompt = data.optimizedPrompt;

                    // Hiển thị kết quả
                    optimizedPromptText.textContent = data.optimizedPrompt;
                    resultImage.src = `data:image/png;base64,${data.imageBase64}`;
                    resultArea.classList.remove('hidden');
                } else {
                    throw new Error(data.message || 'Có lỗi xảy ra từ máy chủ.');
                }
            } catch (error) {
                // Hiển thị lỗi
                errorText.textContent = `❌ Lỗi: ${error.message}`;
                errorArea.classList.remove('hidden');
                console.error(error);
            } finally {
                // Trả UI về trạng thái ban đầu
                submitBtn.disabled = false;
                submitBtn.classList.remove('cursor-not-allowed', 'opacity-80');
                btnText.textContent = 'Bắt đầu tạo ảnh';
                loadingSpinner.classList.add('hidden');
            }
        });

        // Download ảnh
        downloadBtn.addEventListener('click', () => {
            if (!currentImageBase64) return;

            const link = document.createElement('a');
            link.href = `data:image/png;base64,${currentImageBase64}`;
            link.download = `ai-generated-${Date.now()}.png`;
            link.click();

            // Hiển thị success message
            successText.textContent = '✅ Ảnh đã được tải xuống!';
            successMessage.classList.remove('hidden');
            setTimeout(() => successMessage.classList.add('hidden'), 3000);
        });

        // Copy Prompt
        copyBtn.addEventListener('click', () => {
            if (!currentPrompt) return;

            navigator.clipboard.writeText(currentPrompt).then(() => {
                successText.textContent = '✅ Prompt đã được sao chép!';
                successMessage.classList.remove('hidden');
                setTimeout(() => successMessage.classList.add('hidden'), 3000);
            });
        });
    </script>
</body>
</html>
